name: 功能建议或一般问题 / Feature request or general question
description: 提出功能建议，或提出不属于缺陷的问题。/ Suggest a feature or ask a question that is not a bug report.
body:
  - type: markdown
    attributes:
      value: |
        连接失败或断连请使用[连接问题表单](https://github.com/Tupig/DiPlay/issues/new?template=connection.yml)并附上诊断日志；其他缺陷请使用[其他缺陷表单](https://github.com/Tupig/DiPlay/issues/new?template=bug.yml)。

        For connection failures or disconnects, use the [Connection problem form](https://github.com/Tupig/DiPlay/issues/new?template=connection.yml) and attach diagnostic logs. For other bugs, use the [Other bug form](https://github.com/Tupig/DiPlay/issues/new?template=bug.yml).
  - type: textarea
    id: request
    attributes:
      label: 功能建议或问题 / Feature request or question
      description: '描述你想实现的功能，以及它能带来什么帮助。/ Describe what you would like to do and how it would help.'
    validations: {required: true}
  - type: textarea
    id: context
    attributes:
      label: 设备信息与补充说明 / Device information and additional context
      description: '如相关，请附车型/车机型号、Android/DiLink/固件版本、DiPlay 版本以及 iPhone/iOS 版本。/ If relevant, include the car/head-unit model, Android/DiLink/firmware version, DiPlay version and iPhone/iOS version.'
