name: 其他缺陷（显示、音频、安装或控制）/ Other bug (display, audio, installation or controls)
description: 报告连接失败或断连之外的其他问题。/ Report a problem other than a connection failure or disconnection.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        USB/蓝牙/Wi-Fi 连接失败、打开 CarPlay 卡住、重连循环、断连或依赖连接的卡顿，请改用[连接问题表单](https://github.com/Tupig/DiPlay/issues/new?template=connection.yml)。连接类报告必须附诊断日志。

        For USB/Bluetooth/Wi-Fi connection failures, getting stuck opening CarPlay, reconnect loops, disconnects or connection-dependent stutter, use the [Connection problem form](https://github.com/Tupig/DiPlay/issues/new?template=connection.yml). Connection reports require diagnostic logs.

        请在停车状态下测试。报告是公开的：附上诊断文件前请检查并删除个人信息，切勿提交凭据。

        Test while parked. Reports are public: review diagnostic files and remove personal information before attaching them. Never post credentials.
  - type: input
    id: version
    attributes: {label: DiPlay 版本 / DiPlay version, placeholder: '设置 → 关于 中的确切版本 / Exact version from Settings → About'}
    validations: {required: true}
  - type: input
    id: car
    attributes: {label: 车辆与车机型号 / Car and head-unit model, placeholder: '车型/年款、车机、DiLink/Android 版本与确切固件 / Car model/year, head unit, DiLink/Android version and exact firmware'}
    validations: {required: true}
  - type: input
    id: phone
    attributes: {label: iPhone 型号与确切 iOS 版本 / iPhone model and exact iOS version}
    validations: {required: true}
  - type: dropdown
    id: transport
    attributes:
      label: 连接方式 / Connection
      options: ['无线：内置车载热点 / Wireless: built-in car hotspot', '无线：Wi-Fi Direct / Wireless: Wi-Fi Direct', '无线：现有 Wi-Fi（同一局域网）/ Wireless: Existing Wi-Fi / Same LAN', 'USB', '两者都有 / Both', '其他或不确定 / Other or unsure']
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: 发生了什么以及如何复现 / What happened and how to reproduce it
      description: '请写明预期行为、复现步骤、相关设置和大概的故障时间。无线连接请写明后端、显示的频段/信道，以及车机是否同时连接了其他 Wi-Fi。同一局域网请写明路由器型号及是否开启客户端隔离。/ Include expected behavior, steps, relevant settings and the approximate failure time. For wireless, include the backend, band/channel if shown, and whether the car is also connected to another Wi-Fi network. For Same LAN, include the router model and whether client isolation is enabled.'
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断报告或录屏 / Diagnostic report or recording
      description: '请在最新官方发布版上复现，然后 设置 → 诊断 → 保存诊断报告。Android 10+ 通常保存到 Downloads/DiPlay；Android 7.1–9 使用文档选择器。无法保存时，可在完成提示里用 查看报告 或 分享。附上前请检查文本，切勿包含热点密码，并写明大概的故障时间。安装失败请附安装器错误与 Android/API 版本；应用内报告可能不可用。/ Reproduce on the latest official release, then Settings → Diagnostics → Save diagnostic report. Android 10+ normally saves to Downloads/DiPlay; Android 7.1–9 uses a document picker. If saving is unavailable, use View report or Share in the confirmation. Review the text before attaching it and never include your hotspot password. Include the approximate failure time. For installation failures, attach the installer error and Android/API version; an in-app report may not be available.'
