name: Build DiPlay Android TV source APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned: the build depends on SDK components that ship with the Ubuntu 24.04 image,
    # and ubuntu-latest migrates to Ubuntu 26.04 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: ./.github/actions/setup-android
      - name: Test, lint and build without authentication assets
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: DiPlay-Android-TV-source-only
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
