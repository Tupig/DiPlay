name: Build, scan and publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly CodeQL re-scan.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # A manual run also uploads the source-only APK produced by the check job.

permissions:
  contents: read

jobs:
  check:
    # Pinned: the build depends on SDK components that ship with the Ubuntu 24.04 image,
    # and ubuntu-latest migrates to Ubuntu 26.04 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: ./.github/actions/setup-android
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
      - name: Source-only APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: DiPlay-Android-TV-source-only
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      # The toolchain must match docs/BUILD.md. github/codeql-action/autobuild pins
      # Temurin 17 and does not install the Android SDK, so it cannot build this project.
      # No Gradle cache here either: a restored build cache would let the traced build skip
      # compilation, and CodeQL would analyse an empty database.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: ./.github/actions/setup-android
      - uses: github/codeql-action/init@v4
        with:
          languages: java
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - uses: github/codeql-action/analyze@v4

  pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
