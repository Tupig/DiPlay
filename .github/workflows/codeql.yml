name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java
          # Buildless analysis. autobuild forces Temurin 17, but this project needs JDK 25
          # plus the Android SDK, so a traced build would fail before analysis starts.
          build-mode: none
      - uses: github/codeql-action/analyze@v3
