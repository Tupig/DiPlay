name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    # Pinned: the build depends on SDK components that ship with the Ubuntu 24.04 image,
    # and ubuntu-latest migrates to Ubuntu 26.04 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      # The toolchain must match docs/BUILD.md. github/codeql-action/autobuild pins
      # Temurin 17 and does not install the Android SDK, so it cannot build this project.
      # No Gradle cache here: a restored build cache would let the traced build skip
      # compilation, and CodeQL would analyse an empty database.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: ./.github/actions/setup-android
      - uses: github/codeql-action/init@v4
        with:
          languages: java
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - uses: github/codeql-action/analyze@v4
